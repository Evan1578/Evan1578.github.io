name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your branch is named master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby and Build Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Automatically chooses a compatible 3.1 patch version
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Site manually
        run: |
          bundle exec jekyll build --source ./ --destination ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
